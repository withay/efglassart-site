<!doctype html>
<html lang="en">
<head>
  <title>Gallery - EFGlassArt</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/index.html">
      <span class="brand-mark"></span>
      <span class="brand-text">EFGlassArt</span>
    </a>

    <nav class="site-nav">
      <a href="/gallery.html" aria-current="page">Gallery</a>
      <a href="/stained-glass.html">Stained Glass</a>
      <a href="/fused-glass.html">Fused Glass</a>
      <a href="/commissions.html">Commissions</a>
      <a href="/events.html">Events</a>
      <a href="/about.html">About</a>
      <a href="/testimonials.html">Testimonials</a>
    </nav>
  </div>
</header>

<main class="container flow">

<header class="page-header">
  <h1>Gallery</h1>
  <p>A selection of stained and fused glass work.</p>
</header>

<section class="card">
  <h2>All Work</h2>

  <div class="gallery-grid">

    <!-- Example card -->
    <article class="piece-card">
      <img
        src="/assets/images/gallery/sg-tree-of-life.jpg"
        alt="Tree of Life stained glass"
        data-lightbox
      >
      <div class="piece-body">
        <h3>Tree of Life</h3>
        <p class="muted">Stained glass • 2026</p>
      </div>
    </article>

    <article class="piece-card">
      <img
        src="/assets/images/gallery/sg-chrono-window.jpg"
        alt="Chrono Window Panel"
        data-lightbox
      >
      <div class="piece-body">
        <h3>Chrono Window Panel</h3>
        <p class="muted">Stained glass • 2026</p>
      </div>
    </article>

    <!-- Repeat for the rest -->
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="container">
    <p><strong>EFGlassArt</strong> — stained and fused glass by Eryc Courmac.</p>
    <p class="muted">© <span id="year"></span> EFGlassArt.</p>
  </div>
</footer>

<!-- LIGHTBOX OVERLAY -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose">×</span>
  <img id="lightboxImg" alt="">
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeBtn = document.getElementById('lightboxClose');

  document.querySelectorAll('[data-lightbox]').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });

  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) {
      lightbox.classList.remove('active');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      lightbox.classList.remove('active');
    }
  });
</script>

</body>
</html>
